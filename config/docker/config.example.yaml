# SIP-SWITCH 容器内配置模板（Docker / compose 专用）
#
# 用法：
#   1. cp config/docker/config.example.yaml config/docker/config_settings.yaml
#   2. 把下面 <...> 占位替换为真实值（尤其是 auth 段，否则无法登录管理端）
#   3. config_settings.yaml 已被 .gitignore 忽略，禁止提交。
#
# 注意：值为「裸写、无引号」的 YAML 标量 —— 凭据字符集限定 [A-Za-z0-9_-] 且以字母开头，
#       否则会破坏 YAML 解析。
#
# 主机名说明：compose 内用服务名互访，因此这里是 mysql / freeswitch，不是 127.0.0.1。

esl:
  host: freeswitch              # compose 服务名
  port: 8021
  password: change-me-esl       # 必须与 .env 的 ESL_PASSWORD 一致
  reconnect_interval: 5
  fs_node_uuid:

api:
  host: 0.0.0.0
  port: 8000

mysql:
  # 用户/密码/库名与 .env 的 MYSQL_* 保持一致，主机名用 compose 服务名 mysql
  url: mysql+pymysql://sip_switch:change-me@mysql:3306/sip_switch?charset=utf8mb4
  pool_recycle: 3600

# FS 目录请求未携带 domain 时的兜底域（多数请求会带，仅防呆）。
# 留空则回退空串并在日志告警一次；请勿填写生产内网地址以外的环境 IP。
default_sip_domain: <sip-domain>

prepaid_enabled: true          # true=预付费（余额不足 603 拒呼 + 挂断后扣费）；false=纯监控不计费

auth:
  admin_user: admin
  password_salt: <random-salt>                 # secrets.token_hex(24)
  admin_password_hash: <sha256-salt-password>  # sha256(password_salt + 明文密码).hexdigest()
  jwt_secret: <random-secret>                  # secrets.token_hex(24)
  token_expire_minutes: 120

# ---- xml_curl 回调鉴权（第1/3类）----
# FS 经 mod_xml_curl 回调 /fs/dialplan /fs/directory /fs/config 的 HTTP Basic 共享凭据。
# 必须与 .env 的 XMLCURL_USER / XMLCURL_PASSWORD 同值（deploy.sh 自动生成两侧同源）。
# 留空 = fail-closed：网关对 /fs/* 一律 401，FS 拉不到任何配置。
xml_curl:
  user: xmlcurl
  password: change-me-xmlcurl

# ---- 节点标识（第1类；多节点部署须唯一）----
# 留空 = 自动回落主机名（单机/开发可用）；生产多节点须由 deploy.sh 生成唯一值。
node:
  uuid: __NODE_UUID__

# ---- 录音（第1类；#70 录音 URI 抽象已落地）----
# 两个「视图」刻意拆开：FS 与网关各有自己的文件系统，`/recordings` 只是二者共享的挂载点。
#   dir        —— **FS 视角**的写入根，写进 dialplan；实际落 /<dir>/<node_uuid>/<uuid>.wav
#   local_root —— **网关视角**的读取根，解析 local://<node_uuid>/<file> 时拼路径做回源
# ⚠️ 改这两个值必须同步改 docker-compose.yml 里录音卷的容器侧挂载点，否则两边对不上；
#    单机部署保持默认（compose 已把宿主 ./data/recordings 挂到 /recordings）即可。
record:
  dir: /recordings
  local_root: /recordings
  backend: local            # local（默认，本期落地）| cos（上云阶段：对象存储签名直链）

# ---- Redis（Phase1 基础设施，DEP-2 强制）----
# 省略 / 留空 = 使用 compose 服务名 redis:6379（容器 Redis，最常用）
# 切换云 Redis：显式填写 host / port / password / db
redis:
  enabled: true
  host: redis
  port: 6379
  password: ""
  db: 0
