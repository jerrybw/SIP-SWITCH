# SIP Switch Gateway — nginx 反代样例（生产部署参考）
# 放置路径：/etc/nginx/conf.d/sip-admin.conf
# 证书：自签或 CA 签发，SAN 含你的域名或服务器 IP

server {
    listen 443 ssl;
    server_name _;   # 改为你的域名或服务器 IP，例如 sip.example.com

    ssl_certificate     /etc/nginx/ssl/sip_admin.crt;
    ssl_certificate_key /etc/nginx/ssl/sip_admin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 管理端反向代理到本机网关（8000）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP 80 直接断开（仅留 443 对外）
server {
    listen 80 default_server;
    return 444;
}
