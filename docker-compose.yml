name: sip-switch

# SIP-SWITCH 全栈一键起（dev / 演示版）
# 用法见 docs/docker.md

services:
  mysql:
    restart: unless-stopped
    image: mysql:8.0
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # 纯结构 schema（无数据），空库启动时自动建全表
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sipnet

  freeswitch:
    restart: unless-stopped
    # 默认自建镜像：Docker Hub 无 signalwire/freeswitch 运行时镜像，见 deploy/fs-image/Dockerfile
    image: ${FS_IMAGE:-sip-switch-fs:1.11.2}
    build:
      context: .
      dockerfile: deploy/fs-image/Dockerfile
      args:
        FS_BASE: ${FS_BASE:-signalwire/freeswitch-public-base:latest}
        FS_REF: ${FS_REF:-v1.11.2}
        JOBS: ${FS_JOBS:-8}
    environment:
      EXT_SIP_IP: ${EXT_SIP_IP:-}
      ESL_PASSWORD: ${ESL_PASSWORD}
      # xml_curl 回调网关 /fs/* 的 HTTP Basic 凭据（须与 config_settings.yaml [xml_curl] 同值）
      XMLCURL_USER: ${XMLCURL_USER:-xmlcurl}
      XMLCURL_PASSWORD: ${XMLCURL_PASSWORD}
      GATEWAY_URL: http://gateway:8000
      RTP_START: ${RTP_START:-20000}
      RTP_END: ${RTP_END:-20100}
      # 源码安装布局；官方镜像布局为 /etc/freeswitch
      FS_CONF_DIR: ${FS_CONF_DIR:-/usr/local/freeswitch/etc/freeswitch}
      FS_COMMAND: ${FS_COMMAND:-freeswitch -c -nonat}
    ports:
      # internal profile：话机注册 / 入局来话（默认 5060）
      - "${SIP_PORT:-5060}:5060/udp"
      # external profile：落地网关出局 / 运营商来话（默认 5080），bridge 经 sofia/gateway/<name> 走此端口
      - "${SIP_PORT_EXT:-5080}:5080/udp"
      # RTP 媒体端口范围（internal/external 共用）
      - "${RTP_RANGE:-20000-20100}:${RTP_RANGE:-20000-20100}/udp"
    volumes:
      - ./deploy/fs-config:/fs-config:ro
      # #70 录音：FS 写、网关只读回源，两者挂同一宿主目录（容器重建录音不丢）。
      # 容器内固定 /recordings（= record.dir 默认值）；录音实际落在 /recordings/<node_uuid>/ 下。
      - ./data/recordings:/recordings
    entrypoint: ["/fs-config/docker-entrypoint-fs.sh"]
    command: ["sh", "-c", "exec ${FS_COMMAND}"]
    networks:
      - sipnet

  gateway:
    restart: unless-stopped
    build:
      context: .
      args:
        FS_IMAGE: ${FS_IMAGE:-sip-switch-fs:1.11.2}
    environment:
      GATEWAY_CONFIG: /app/config/config_settings.yaml
      EXT_SIP_IP: ${EXT_SIP_IP:-}
      FS_CONFIG_RO: /fs-config-ro
    volumes:
      # 首次运行前：cp config/docker/config.example.yaml config/docker/config_settings.yaml
      - ./config/docker:/app/config:ro
      # 机制 A：只读挂载 FS 配置，供网关应用动态生成 sofia.conf（网关不落盘）
      - ./deploy/fs-config:/fs-config-ro:ro
      # #70 录音回源：只读挂同一录音目录（/api/cdr/{uuid}/recording 直接流式读本地文件）
      - ./data/recordings:/recordings:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sipnet

  sipp-stub:
    restart: unless-stopped
    # dev 端 SIP 落地桩，模拟 carrier trunk 应答 OPTIONS/INVITE。完全无外网依赖。
    # gw-carrier-a 的 gateway 记录 ip 指向 'sipp-stub' 服务名 DNS，
    # 出局/呼叫/挂断/CDR/billing 全链路即可跑通（FS 经 external profile 出局，
    # 落地网关由 /fs/config 动态下发（机制 A，不落盘），FS bridge 经 sofia/gateway/<gw_name>
    # 走桩）。验证 PSTN 类流程前先把生产真 trunk 切回。
    image: sip-switch-sipp-stub:latest
    build:
      context: ./deploy/sipp-stub
    ports:
      - "15060:5060/udp"
      - "15060:5060/tcp"
    networks:
      - sipnet

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"${REDIS_PASSWORD:-}\" ]; then redis-cli ping; else redis-cli -a \"${REDIS_PASSWORD}\" ping; fi | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - sipnet

volumes:
  mysql-data:
  redis-data:

networks:
  sipnet:
    driver: bridge
